name: Flutter CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          docker image prune -af 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt-get clean || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install NDK 28.2.13676358
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" > /dev/null 2>&1 || true
          ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null || true

      - name: Write local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.buildMode=debug" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=35" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Disk space before APK build
        run: df -h

      - name: Build debug APK (arm64 only)
        id: build_apk
        timeout-minutes: 10
        run: flutter build apk --debug --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload debug APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: servana-client-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release-android:
    name: Release Build (Android)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NDK 28.2.13676358
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" > /dev/null 2>&1 || true

      - name: Decode keystore
        env:
          CM_KEYSTORE_BASE64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: |
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks

      - name: Write local.properties for release
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=35" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build release AAB
        env:
          CM_KEYSTORE_PATH: /tmp/upload-keystore.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          sed -i "s/REPLACE_WITH_GOOGLE_MAPS_API_KEY/$GOOGLE_MAPS_API_KEY/g" \
            android/app/src/main/res/values/strings.xml
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://api.servana.com.ph \
            --dart-define=BRAND=servana \
            --dart-define=MOCK_BACKEND=false \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Verify signing
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify \
            --verbose \
            build/app/outputs/bundle/release/app-release.aab || true

      - name: Compute SHA-256 checksum
        run: |
          sha256sum build/app/outputs/bundle/release/app-release.aab \
            > build/app/outputs/bundle/release/app-release.aab.sha256
          cat build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: servana-client-release-aab-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          retention-days: 90
