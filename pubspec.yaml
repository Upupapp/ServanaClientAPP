name: client
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+40

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  get_it: ^7.6.7
  bloc: ^8.1.3
  freerasp: ^8.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  image_picker: ^1.0.7
  flutter_secure_storage: ^9.0.0
  intl: 0.19.0
  provider: ^6.1.1
  go_router: ^14.2.7
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  material_dialogs: ^1.1.4
  flutter_typeahead: ^5.2.0
  dropdown_button2: ^2.3.9
  pinput: ^5.0.0
  file_picker: ^8.1.2
  image_cropper: ^8.0.2
  fraction: ^5.0.2
  intl_phone_field: ^3.2.0
  gap: ^3.0.1
  firebase_crashlytics: ^4.1.1
  overlay_tooltip: 0.2.3
  in_app_update: ^4.2.2
  json_serializable: ^6.7.1
  blur: ^4.0.0
  firebase_core: ^3.4.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.9
  ticket_clippers: 0.0.8
  dotted_line: ^3.2.2
  email_validator_flutter: ^1.0.0
  input_quantity: ^2.3.2
  flutter_slidable: ^3.1.0
  u_credit_card: ^1.1.0
  google_maps_flutter: ^2.6.0
  another_stepper: ^1.2.2
  number_text_input_formatter: ^1.0.0+8
  loader_overlay: ^4.0.2
  flutter_switch: 0.3.2
  flutter_spinkit: ^5.2.1
  configurable_expansion_tile_null_safety: ^3.3.2
  quickalert: ^1.1.0
  currency_text_input_formatter: ^2.2.3
  mobx: ^2.3.3+2
  flutter_mobx: ^2.2.1+1
  socket_io_client: ^2.0.3+1
  firebase_analytics: ^11.3.2
  firebase_performance: 0.10.0+10
  # LAUNCHBANNER+ §21/§22: the campaign kill switch and date/impression
  # targeting must be changeable without shipping a build.
  firebase_remote_config: ^5.1.3
  firebase_messaging: ^15.1.0
  phone_numbers_parser: ^9.0.0
  toastification: ^2.3.0
  pull_to_refresh: ^2.0.0
  location_picker_flutter_map: ^3.0.1
  geolocator: ^10.1.1
  location: ^7.0.1
  geocoding: ^3.0.0
  easy_stepper: 0.8.5+1
  http: ^1.6.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.2.5
  qr_flutter: ^4.1.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  # Required by App Store Review Guideline 4.8: an app offering Google or
  # Facebook login must also offer a privacy-preserving equivalent.
  # Imported directly by registration_bloc, add_item_bloc and
  # store_items_bloc while only ever a transitive dependency (TAB 02).
  # Relying on an intermediate to keep supplying it is a build that
  # breaks on somebody else's release note. Pinned, not `any` — the
  # analyzer's own suggestion was `any`, which is looser than the
  # caret-on-0.x case this file already refuses.
  collection: 1.19.1
  sign_in_with_apple: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  freezed: ^2.4.7
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mobx_codegen: ^2.6.1
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#2555C9"
    theme_color: "#2555C9"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Keep iOS/macOS plugins on CocoaPods.
  #
  # Flutter's Swift Package Manager path resolves firebase_core through SPM
  # while several other Firebase plugins still declare a CocoaPods dependency
  # on it. The two resolvers then disagree about which firebase_core is present
  # and the build fails inside a pod, naming a symbol rather than the cause.
  #
  # This is a build-system selection, not a platform-specific implementation:
  # it changes how the same Dart code is assembled for Apple platforms and adds
  # no iOS-only code path. Remove it once every Firebase plugin ships an SPM
  # manifest.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/messages/
    - assets/images/services/
    - assets/images/splash/
    - assets/images/states/
    - assets/images/welcome/
    # Campaign creatives. Declared as an explicit directory so a new campaign
    # asset ships by being dropped in. The uncompressed PNG sources live in
    # assets_src/campaigns/ and are deliberately NOT declared here — they are
    # the editable originals, and bundling both would forfeit the compression.
    - assets/images/campaigns/
    # Per-category campaign creatives shown when a customer taps a category
    # card. Declared as a directory for the same reason as campaigns/ above.
    #
    # Filenames here must be lowercase. Windows is case-insensitive, so a file
    # named BEAUTY_WELLNESS_POPUP_V1.png loads fine on a dev machine and then
    # fails to resolve on iOS and Android, which are not. That exact mismatch
    # was present when this directory was first populated.
    - assets/images/categories/
    - assets/animations/
    - assets/icons/
    - assets/payment_icons/
    - assets/jsons/philippine-addresses/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
