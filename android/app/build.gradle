plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Is a real upload key available at all? Read once, used both to populate the
// signing config and to refuse a release build that has none.
def hasCodemagicSigning = System.getenv("CM_KEYSTORE_PATH") != null
def hasLocalSigning = keystorePropertiesFile.exists()
def hasReleaseSigning = hasCodemagicSigning || hasLocalSigning

/**
 * A release build with no key must FAIL, not quietly produce something.
 *
 * `signingConfigs.release` is populated only when the Codemagic environment
 * variables or `key.properties` are present. With neither it is an EMPTY
 * config, and on AGP 8.x that yields an UNSIGNED artefact — the inline comment
 * claiming the build falls back to the debug key was simply wrong. Either
 * outcome, unsigned or signed with something unexpected, was discovered at
 * upload time rather than at build time.
 *
 * Play upload-key mistakes are close to unrecoverable, and this project has
 * already been through Play re-signing requiring both certificates. A build
 * that cannot state which key signed it is a build that should not exist.
 *
 * Checked on the task graph rather than at configuration time, so `flutter run`
 * and every debug and profile build are completely unaffected.
 */
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.name ==~ /(?i).*(assemble|bundle)Release.*/
    }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured, so this build would produce an " +
            "UNSIGNED artefact.\n" +
            "  Provide EITHER the Codemagic environment variables " +
            "(CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD)\n" +
            "  OR android/key.properties with storeFile, storePassword, keyAlias, keyPassword.\n" +
            "Debug and profile builds are unaffected. Never commit either — see .gitignore."
        )
    }
}

android {
    namespace "com.servana.serviceclient"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.servana.serviceclient"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        multiDexEnabled true   
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (System.getenv()["CM_KEYSTORE_PATH"]) {
                // Codemagic CI: keystore injected via env vars
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            } else if (keystorePropertiesFile.exists()) {
                // Local release build: key.properties present
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
            // No third branch. When neither source is present this config stays
            // empty and the task-graph guard above refuses the build, rather
            // than emitting an unsigned bundle that fails at upload.
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            // `proguardFiles` was declared here WITHOUT `minifyEnabled true`,
            // and without that flag neither the shrinker nor the obfuscator
            // runs. The 8-line proguard-rules.pro was dead configuration that
            // read, to anyone opening the repository, as evidence of a
            // hardening step that was not happening.
            //
            // That compounds badly with what else ships here: freerasp is a
            // runtime self-protection SDK whose whole purpose is to detect
            // tampering and repackaging, and it was shipping alongside fully
            // readable, unobfuscated bytecode. Paying for RASP and skipping
            // obfuscation is the worst of both positions.
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
          // TODO: Add your own signing config for the release build.
          // Signing with the debug keys for now, so `flutter run --release` works.
          signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// The Talsec native SDK is declared by the freerasp plugin itself
// (freerasp/android/build.gradle: talsec_version). It was ALSO pinned here at
// 6.4.0, twelve majors behind. Gradle's highest-wins hid that, but a
// dependency lock or a resolutionStrategy would have resolved 6.4.0 and
// silently reintroduced the 4 KB aligned native libraries. Let the plugin own
// its own dependency.

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
